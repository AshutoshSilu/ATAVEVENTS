<header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-950/70 backdrop-blur-2xl">
  <nav class="section-shell flex h-20 items-center justify-between">
    <a routerLink="/" class="group flex items-center gap-3" (click)="closeMenu()" aria-label="AtAv Events home">
      <span class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-rose-500 via-fuchsia-500 to-violet-500 text-lg font-black shadow-lg shadow-rose-500/30 transition group-hover:scale-105">A</span>
      <span>
        <span class="block text-lg font-black tracking-wide">AtAv Events</span>
        <span class="block text-xs uppercase tracking-[0.32em] text-rose-200/70">Celebrate Better</span>
      </span>
    </a>

    <button
      type="button"
      class="rounded-2xl border border-white/10 p-3 text-slate-100 transition hover:border-rose-300/60 hover:bg-white/10 md:hidden"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="block h-0.5 w-6 rounded bg-current transition" [ngClass]="{ 'translate-y-1.5 rotate-45': isMenuOpen() }"></span>
      <span class="my-1 block h-0.5 w-6 rounded bg-current transition" [ngClass]="{ 'opacity-0': isMenuOpen() }"></span>
      <span class="block h-0.5 w-6 rounded bg-current transition" [ngClass]="{ '-translate-y-1.5 -rotate-45': isMenuOpen() }"></span>
    </button>

    <div
      class="absolute left-4 right-4 top-24 flex-col gap-2 rounded-3xl border border-white/10 bg-slate-950/95 p-4 shadow-2xl shadow-black/40 transition md:static md:flex md:flex-row md:items-center md:gap-1 md:border-0 md:bg-transparent md:p-0 md:shadow-none"
      [ngClass]="isMenuOpen() ? 'flex animate-fade-up' : 'hidden md:flex'"
    >
      <a routerLink="/" routerLinkActive="text-rose-200 bg-white/10" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" class="rounded-full px-4 py-3 text-sm font-semibold text-slate-200 transition hover:bg-white/10 hover:text-white">Home</a>
      <a routerLink="/events" routerLinkActive="text-rose-200 bg-white/10" (click)="closeMenu()" class="rounded-full px-4 py-3 text-sm font-semibold text-slate-200 transition hover:bg-white/10 hover:text-white">Event Details</a>
      <a routerLink="/login" routerLinkActive="text-rose-200 bg-white/10" (click)="closeMenu()" class="rounded-full px-4 py-3 text-sm font-semibold text-slate-200 transition hover:bg-white/10 hover:text-white">Login</a>
      <a routerLink="/register" (click)="closeMenu()" class="rounded-full bg-gradient-to-r from-rose-500 to-violet-500 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-rose-500/30 transition hover:-translate-y-0.5 hover:shadow-rose-500/50">Register</a>
    </div>
  </nav>
</header>
